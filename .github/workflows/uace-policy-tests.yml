name: ChatB2K UACE policy tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/lib/chatb2k/**'
      - 'src/routes/api/chatb2k/uace/**'
      - 'tests/chatb2k/**'
      - 'supabase/migrations/*uace*'
      - 'docs/chatb2k/**'
      - 'package.json'
      - 'bun.lock*'
      - '.github/workflows/uace-policy-tests.yml'

permissions:
  contents: read

concurrency:
  group: uace-policy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Install dependencies using repository's existing Bun workflow
        run: bun install
      - name: Run UACE policy and credential tests
        run: bunx vitest run tests/chatb2k/universal-config-engine.test.ts tests/chatb2k/provider-credential-broker.test.ts
      - name: Type-check application source
        run: bunx tsc --noEmit
