name: ChatB2K UACE policy tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/lib/chatb2k/universal-config-engine.ts'
      - 'src/lib/chatb2k/universal-config-engine.test.ts'
      - 'docs/chatb2k/universal-authorized-configuration-engine.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/uace-policy-tests.yml'

permissions:
  contents: read

concurrency:
  group: uace-policy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run UACE policy tests
        run: npx vitest run src/lib/chatb2k/universal-config-engine.test.ts
      - name: Type-check application source
        run: npx tsc --noEmit
