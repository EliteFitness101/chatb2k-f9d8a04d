name: ChatB2K Omni Registry Sync

on:
  push:
    branches: [main]
    paths:
      - 'config/omni-credential-registry.json'
      - 'scripts/sync-omni-registry.mjs'
      - '.github/workflows/chatb2k-registry-sync.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: chatb2k-omni-registry-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate registry manifest
        run: node --check scripts/sync-omni-registry.mjs && node scripts/sync-omni-registry.mjs --validate
      - name: Verify unauthenticated registry requests are rejected
        env:
          SUPABASE_URL: https://vbqjvmnhdtdhmeeudqnn.supabase.co
        run: |
          node --input-type=module <<'NODE'
          const endpoint = process.env.SUPABASE_URL.replace(/\/$/, '') + '/functions/v1/chatb2k-registry-sync';
          const response = await fetch(endpoint, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ bindings: [] }) });
          if (response.status !== 401) throw new Error(`Expected unauthenticated request HTTP 401, received HTTP ${response.status}`);
          console.log('PASS registry endpoint denies unauthenticated requests: HTTP 401');
          NODE
      - name: Reconcile infrastructure manifest using GitHub OIDC
        env:
          SUPABASE_URL: https://vbqjvmnhdtdhmeeudqnn.supabase.co
        run: node scripts/sync-omni-registry.mjs
