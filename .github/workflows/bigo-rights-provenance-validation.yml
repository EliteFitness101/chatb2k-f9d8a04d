name: BIGO rights and provenance validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/bigo-capture-host.sh'
      - 'scripts/reconcile-bigo-provenance-config.py'
      - '.github/workflows/bigo-live-automation.yml'
      - '.github/workflows/bigo-provenance-config-sync.yml'
      - 'supabase/functions/bigo-live-pipeline/index.ts'
      - '.github/workflows/bigo-rights-provenance-validation.yml'
permissions:
  contents: read
jobs:
  validate-rights-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent capture and publication eligibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pipeline = Path('supabase/functions/bigo-live-pipeline/index.ts').read_text()
          capture = Path('scripts/bigo-capture-host.sh').read_text()
          config_script = Path('scripts/reconcile-bigo-provenance-config.py').read_text()
          workflow = Path('.github/workflows/bigo-live-automation.yml').read_text()
          sync_workflow = Path('.github/workflows/bigo-provenance-config-sync.yml').read_text()
          assert 'async function resolveBigoRights' in pipeline
          assert 'allowed=!!source&&active&&allowlisted' in pipeline
          assert 'rights_evidence:rights.evidence' in pipeline
          assert 'independent_rights_verified:false' in pipeline
          assert 'ownership_verified:false' in pipeline
          assert 'async function approveAllowlist(' not in pipeline
          assert "'original_url':room_url" in capture
          assert "'source_stream_url':source_stream_url" in capture
          assert "'source_page_url':room_url" in capture
          assert 'SOURCE_URL="${BIGO_ROOM_URL}"' in capture
          assert 'PAGE_URL="$BIGO_ROOM_URL"' in capture
          assert 'PAGE_KIND="canonical room page"' in capture
          assert 'https://www.bigo.tv/sid/*' not in capture
          assert 'SOURCE_OVERRIDE" == https://slink.bigovideo.tv/*' in capture
          assert "'original_url':source_url" not in capture
          import py_compile
          py_compile.compile('scripts/reconcile-bigo-provenance-config.py', doraise=True)
          assert 'global_clearance' in config_script and '"global_clearance": False' in config_script
          assert 'per_asset_rights_evidence_required_for_republication' in config_script
          assert 'store_session_cookies_or_tokens_in_dropbox' in config_script
          assert 'comparable_current = dict(current)' in config_script
          assert 'comparable_current = normalize(current, role, path)' not in config_script
          assert '--check-only' in config_script
          assert 'Reconcile BIGO provenance manifests in Dropbox' in sync_workflow
          assert 'function canonicalBigoRoomUrl' in pipeline
          assert 'originality_verified:true' not in pipeline
          assert 'publication_requirements_not_met' in pipeline
          assert 'publicationEligibility={verified_host:verifiedHost' in pipeline
          assert 'return {accepted:true,highlight_id:old.id' in pipeline
          assert 'pipeline_policy_version' not in workflow
          assert 'provenance-config.outcome' not in workflow
          assert 'storage_only' in workflow
          assert 'BIGO_VERIFIED_HOST_IDS' in workflow
          print('PASS: all captured hosts are ingested; publication eligibility is evaluated at publishing; rights evidence and secret separation are preserved.')
          PY
