name: ChatB2K Omni Registry Validation
on:
  pull_request:
    paths:
      - 'config/omni-credential-registry.json'
      - 'scripts/sync-omni-registry.mjs'
      - 'supabase/functions/chatb2k-registry-sync/**'
      - '.github/workflows/chatb2k-registry-sync.yml'
      - '.github/workflows/chatb2k-registry-validation.yml'
permissions:
  contents: read
concurrency:
  group: chatb2k-omni-registry-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest and sync client
        run: |
          set -euo pipefail
          node --check scripts/sync-omni-registry.mjs
          node scripts/sync-omni-registry.mjs --validate
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function
        run: deno check --no-lock supabase/functions/chatb2k-registry-sync/index.ts
      - name: Validate OIDC trust boundary
        run: |
          set -euo pipefail
          grep -q 'token.actions.githubusercontent.com' supabase/functions/chatb2k-registry-sync/index.ts
          grep -q 'chatb2k-registry-sync' supabase/functions/chatb2k-registry-sync/index.ts
          grep -q 'workflow_ref !== WORKFLOW_REF' supabase/functions/chatb2k-registry-sync/index.ts
          grep -q 'claims.repository !== REPOSITORY' supabase/functions/chatb2k-registry-sync/index.ts
          grep -q 'claims.ref !== BRANCH_REF' supabase/functions/chatb2k-registry-sync/index.ts
          ! grep -Eq 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}' config/omni-credential-registry.json
