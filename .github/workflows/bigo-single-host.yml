name: BIGO configured single-host capture

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BIGO_SINGLE_HOST_ID: ${{ secrets.BIGO_SINGLE_HOST_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install "streamlink>=8.6,<9"
          npm install --prefix /tmp/bigo-blob-sdk --no-audit --no-fund @vercel/blob@2.6.1
      - name: Capture configured host
        run: |
          set -euo pipefail
          : "${BLOB_READ_WRITE_TOKEN:?BLOB_READ_WRITE_TOKEN is required}"
          : "${BIGO_SINGLE_HOST_ID:?BIGO_SINGLE_HOST_ID is required}"
          HOST_SAFE="$(printf '%s' "${BIGO_SINGLE_HOST_ID}" | tr -c 'A-Za-z0-9._-' '_')"
          curl -fsSL "https://raw.githubusercontent.com/EliteFitness101/chatb2k-f9d8a04d/main/scripts/bigo-capture-host.sh" -o /tmp/bigo-capture-host.sh
          chmod +x /tmp/bigo-capture-host.sh
          mkdir -p /tmp/bigo-results
          bash /tmp/bigo-capture-host.sh "${BIGO_SINGLE_HOST_ID}" "https://www.bigo.tv/${BIGO_SINGLE_HOST_ID}"
          cat "/tmp/bigo-results/${HOST_SAFE}.json"
      - name: Upload capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigo-configured-host-${{ github.run_id }}
          path: /tmp/bigo-results/
          if-no-files-found: ignore