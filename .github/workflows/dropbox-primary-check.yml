name: BIGO Blob-primary migration checks

on:
  push:
    branches: [fix/bigo-dropbox-primary-20261010]
    paths:
      - 'scripts/bigo-capture-host.sh'
      - '.github/workflows/bigo-live-automation.yml'
      - '.github/workflows/dropbox-primary-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/bigo-capture-host.sh'
      - '.github/workflows/bigo-live-automation.yml'
      - '.github/workflows/dropbox-primary-check.yml'

permissions:
  contents: read

jobs:
  blob-primary-static:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate capture shell syntax
        run: bash -n scripts/bigo-capture-host.sh
      - name: Assert Vercel Blob is the primary capture path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path("scripts/bigo-capture-host.sh").read_text()
          workflow = Path(".github/workflows/bigo-live-automation.yml").read_text()
          required = [
              "BLOB_READ_WRITE_TOKEN",
              "from '@vercel/blob'",
              "access: 'public'",
              "readbackDigest",
              "BIGO_CAPTURE_PARALLELISM",
              "Supabase BIGO source-of-truth registry loaded",
              "files/upload_session/start",
              "files/get_metadata",
          ]
          missing = [item for item in required if item not in script + workflow]
          assert not missing, f"Missing production capture controls: {missing}"
          assert "BIGO_HOSTS_PER_CYCLE" not in workflow
          assert "kisexy" not in workflow
          assert "R2_WRITE_TOKEN" not in script + workflow
          assert "cloudflare_r2" not in script
          assert "BLOB_READ_WRITE_TOKEN" in workflow
          assert "complete dynamic source-of-truth inventory" in workflow
          print("PASS: dynamic inventory, configurable concurrency, primary Blob upload and SHA-256 read-back; Dropbox optional.")
          PYY
