name: BIGO R2-primary fallback checks

on:
  push:
    branches: [fix/bigo-dropbox-primary-20261010]
    paths:
      - 'scripts/bigo-capture-host.sh'
      - '.github/workflows/bigo-live-automation.yml'
      - '.github/workflows/dropbox-primary-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/bigo-capture-host.sh'
      - '.github/workflows/bigo-live-automation.yml'
      - '.github/workflows/dropbox-primary-check.yml'

permissions:
  contents: read

jobs:
  r2-primary-fallback-static:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate capture shell syntax
        run: bash -n scripts/bigo-capture-host.sh
      - name: Assert R2 primary delivery and verified Dropbox fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path("scripts/bigo-capture-host.sh").read_text()
          workflow = Path(".github/workflows/bigo-live-automation.yml").read_text()
          required = [
              "files/upload_session/start",
              "files/upload_session/append_v2",
              "files/upload_session/finish",
              "files/get_metadata",
              "metadata.get(\"content_hash\") != expected_hash",
              "create_shared_link_with_settings",
              "R2 primary upload and byte-for-byte read-back verified",
              "R2 primary delivery unavailable",
              "Dropbox raw capture archive",
              "Dropbox metadata archive",
          ]
          missing = [item for item in required if item not in script]
          assert not missing, f"Missing R2/fallback controls: {missing}"
          assert "@vercel/blob" not in script, "Blob SDK remains in capture script"
          assert "BLOB_READ_WRITE_TOKEN" not in script, "Blob token remains in capture script"
          assert "@vercel/blob" not in workflow, "Blob SDK remains in BIGO workflow"
          assert "BLOB_READ_WRITE_TOKEN" not in workflow, "Blob token remains in BIGO workflow"
          r2_primary = script.index('r2_upload "$FILE"')
          dropbox_fallback = script.index('dropbox_upload "$FILE"')
          assert r2_primary < dropbox_fallback, "R2 must be attempted before Dropbox for processed media"
          assert 'if [ -z "$BLOB_URL" ] && [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then' in script
          assert "748833040-20261025T065551Z.mp4" not in script, "Pinned historical test asset must not gate live captures"
          print("PASS: R2 primary upload/read-back; Dropbox fallback; Dropbox hash/size integrity retained; Google Drive remains optional.")
          PY
