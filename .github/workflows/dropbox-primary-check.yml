name: BIGO direct R2 storage validation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bigo-capture-host.sh'
      - '.github/workflows/bigo-live-automation.yml'
      - '.github/workflows/dropbox-primary-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/bigo-capture-host.sh'
      - '.github/workflows/bigo-live-automation.yml'
      - '.github/workflows/dropbox-primary-check.yml'

permissions:
  contents: read

jobs:
  direct-r2-static:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate capture shell syntax
        run: bash -n scripts/bigo-capture-host.sh
      - name: Assert direct R2 primary, Blob fallback and Dropbox archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path('scripts/bigo-capture-host.sh').read_text()
          workflow = Path('.github/workflows/bigo-live-automation.yml').read_text()
          required = [
              'r2_upload()',
              'aws s3api put-object',
              'aws s3api get-object',
              'R2_ACCESS_KEY_ID',
              'R2_SECRET_ACCESS_KEY',
              'R2_ENDPOINT',
              'R2_PUBLIC_BASE_URL',
              'R2_BUCKET_NAME',
              'R2 public CDN SHA-256 mismatch',
              'media_delivery_provider',
              'r2_object_readback_verified',
              'blob_upload()',
              'BLOB_READ_WRITE_TOKEN',
              'Dropbox is optional secondary archival',
              'DROPBOX_REFRESH_TOKEN',
              'BIGO_VERIFIED_HOST_IDS',
              'bigo-live-pipeline',
          ]
          missing = [item for item in required if item not in script + workflow]
          assert not missing, f'Missing direct R2 controls: {missing}'
          assert 'workers.dev' not in script + workflow
          assert 'R2_WORKERS_DEV_URL' not in script + workflow
          assert 'BIGO_EGRESS_PROXY' not in script + workflow
          assert 'R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}' in workflow
          assert 'R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}' in workflow
          assert 'R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}' in workflow
          assert 'R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}' in workflow
          assert 'BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}' in workflow
          assert 'CAPTURE_STORAGE_ONLY' in workflow
          assert 'schedule:' in workflow and 'workflow_dispatch:' in workflow
          print('PASS: direct R2 S3 upload and public CDN read-back are primary; Blob is fallback; Dropbox is secondary; no Worker or proxy dependency.')
          PY
