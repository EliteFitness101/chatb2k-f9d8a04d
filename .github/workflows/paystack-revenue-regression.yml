name: Paystack revenue and learning regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/paystack-revenue-learning-events]
permissions:
  contents: read
concurrency:
  group: paystack-revenue-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webhook-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Paystack webhook lifecycle tests
        run: npm run test -- tests/webhooks.test.ts
      - name: Production build
        run: npm run build
