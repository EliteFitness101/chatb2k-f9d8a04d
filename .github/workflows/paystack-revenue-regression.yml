name: Paystack revenue and learning regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/paystack-revenue-learning-events]
permissions:
  contents: read
concurrency:
  group: paystack-revenue-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webhook-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Install dependencies
        run: bun install
      - name: Paystack webhook lifecycle tests
        run: bun run test
      - name: Production build
        run: bun run build
