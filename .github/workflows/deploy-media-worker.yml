name: Deploy ResoFit media Worker

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY_MEDIA_WORKER to deploy the Worker and request media.resofit.fit custom-domain attachment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: resofit-media-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'DEPLOY_MEDIA_WORKER' }}
    runs-on: ubuntu-latest
    environment: media-production
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/media
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Cloudflare credentials are present
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character Cloudflare account ID."
            exit 1
          fi

      - name: Deploy Worker and attach media.resofit.fit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml --keep-vars

      - name: Verify deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 https://media.resofit.fit/health; then
              echo
              echo "PASS: media.resofit.fit health endpoint responded."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Worker deployment did not pass public health verification."
          exit 1
