name: BIGO Live -> Dropbox -> ChatB2K -> Buffer/Drive
# Production capture workflow — Dropbox is canonical media storage; ChatB2K ingests verified Dropbox URLs for enrichment, Buffer, and Drive archive.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bigo-live-automation.yml'
      - 'scripts/bigo-capture-host.sh'
      - 'scripts/bigo-streamlink-capture.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      bigo_host_id:
        description: "BIGO host ID from the supplied share link"
        required: false
        type: string
      bigo_share_url:
        description: "BIGO share URL (for example https://www.bigo.tv/sid/...)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  BIGO_HOST_IDS: ${{ secrets.BIGO_HOST_IDS }}
  BIGO_VERIFIED_HOST_IDS: ${{ secrets.BIGO_VERIFIED_HOST_IDS }}
  BIGO_LIVE_PROBE_HOST_IDS: ${{ secrets.BIGO_LIVE_PROBE_HOST_IDS }}
  CHATB2K_LIVE_INGEST_KEY: ${{ secrets.CHATB2K_LIVE_INGEST_KEY }}
  DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
  DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
  DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
  BIGO_COOKIE_HEADER: ${{ secrets.BIGO_COOKIE_HEADER }}
  # BIGO currently rejects playback-token requests from some egress regions.
  # Set this to an authorized Asia-region HTTPS/SOCKS proxy; Dropbox/Supabase stay direct.
  BIGO_EGRESS_PROXY: ${{ secrets.BIGO_EGRESS_PROXY }}
  BIGO_TARGET_HOST_ID: ${{ github.event.inputs.bigo_host_id }}
  BIGO_TARGET_SHARE_URL: ${{ github.event.inputs.bigo_share_url }}
  PIPELINE_URL: https://vbqjvmnhdtdhmeeudqnn.supabase.co/functions/v1/bigo-live-pipeline

jobs:
  capture-transform-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install capture tools (Dropbox archive)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check -q 'streamlink>=8.6.1,<9' requests

      - name: Set up Chrome browser (no Snap dependency)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Capture, normalize and prepare ChatB2K batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bigo-results
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -fsS -H "Authorization: Bearer ${OIDC_TOKEN}" "${PIPELINE_URL}" > /tmp/bigo-sources.json
          # Supabase returns only active, capture-enabled source records.
          # Capture eligibility is independent from publication eligibility:
          # raw capture may proceed for registry-approved sources; publishing is
          # separately restricted by BIGO_VERIFIED_HOST_IDS in the ingestion step.
          python3 - <<'PY'
          import json, os, re
          sources=json.load(open("/tmp/bigo-sources.json"))
          registry={}
          for item in sources.get("hosts",[]):
              host=str(item.get("bigo_id") or "").strip()
              if not host or not re.fullmatch(r"[A-Za-z0-9._-]+",host):
                  continue
              source=str(item.get("source_url") or "").strip() or ("https://www.bigo.tv/"+host)
              registry[host]=source
          def parse_ids(value):
              return [x.strip() for x in value.replace(",","\n").splitlines() if x.strip()]
          verified=set(parse_ids(os.environ.get("BIGO_VERIFIED_HOST_IDS","")))
          probe=parse_ids(os.environ.get("BIGO_LIVE_PROBE_HOST_IDS",""))
          candidates=dict(registry)
          target_host=os.environ.get("BIGO_TARGET_HOST_ID","").strip()
          target_url=os.environ.get("BIGO_TARGET_SHARE_URL","").strip()
          if target_host or target_url:
              if not re.fullmatch(r"[A-Za-z0-9._-]+",target_host):
                  raise SystemExit("Invalid BIGO_TARGET_HOST_ID")
              if not (target_url.startswith("https://www.bigo.tv/sid/") or target_url.startswith("https://slink.bigovideo.tv/")):
                  raise SystemExit("BIGO_TARGET_SHARE_URL must be an approved BIGO share URL")
              candidates[target_host]=target_url
          for host in probe:
              if re.fullmatch(r"[A-Za-z0-9._-]+",host) and host in verified and host not in candidates:
                  candidates[host]="https://www.bigo.tv/"+host
          if not candidates:
              raise SystemExit("No active registry sources or verified BIGO probe IDs; no capture attempted.")
          report={
              "candidate_count":len(candidates),
              "registry_candidate_count":len(registry),
              "verified_probe_candidate_count":sum(1 for h in probe if h in verified),
              "source":"active capture-enabled registry + verified BIGO_LIVE_PROBE_HOST_IDS",
              "capture_eligibility":"registry or verified configured probe",
              "publication_eligibility":"BIGO_VERIFIED_HOST_IDS enforced separately",
              "candidates":[{"host_id":host,"source_url":url} for host,url in candidates.items()]
          }
          json.dump(report,open("/tmp/bigo-firecrawl-live-report.json","w"))
          with open("/tmp/bigo-hosts.txt","w") as out:
              for host,url in candidates.items():
                  out.write(host+"|"+url+"\n")
          print("BIGO capture candidates: %d (registry=%d, verified probes=%d)" %
                (len(candidates),len(registry),report["verified_probe_candidate_count"]))
          PY
          # Resolve fresh playback manifests from the canonical room page before capture.
          # Firecrawl failures are recorded and fall back to the existing native BIGO resolver.
          curl -fsSL https://raw.githubusercontent.com/EliteFitness101/chatb2k-f9d8a04d/${GITHUB_SHA}/scripts/bigo-firecrawl-hls.py -o /tmp/bigo-firecrawl-hls.py
          python3 /tmp/bigo-firecrawl-hls.py --input /tmp/bigo-hosts.txt --output /tmp/bigo-hosts-resolved.txt --report /tmp/bigo-firecrawl-hls-report.json
          mv /tmp/bigo-hosts-resolved.txt /tmp/bigo-hosts.txt
          echo "Selected $(wc -l < /tmp/bigo-hosts.txt) active, capture-enabled BIGO source(s)"
          curl -fsSL https://raw.githubusercontent.com/EliteFitness101/chatb2k-f9d8a04d/${GITHUB_SHA}/scripts/bigo-capture-host.sh -o /tmp/bigo-capture-host.sh
          curl -fsSL https://raw.githubusercontent.com/EliteFitness101/chatb2k-f9d8a04d/${GITHUB_SHA}/scripts/bigo-streamlink-capture.py -o /tmp/bigo-streamlink-capture.py
          chmod +x /tmp/bigo-capture-host.sh /tmp/bigo-streamlink-capture.py
          export BIGO_STREAMLINK_WRAPPER=/tmp/bigo-streamlink-capture.py
          run_capture() {
            local HOST_ID="$1"
            local SOURCE_URL="$2"
            local SOURCE_KIND="${3:-fallback}"
            if ! bash /tmp/bigo-capture-host.sh "${HOST_ID}" "${SOURCE_URL}" "${SOURCE_KIND}"; then
              echo "::error::Capture failed for host ${HOST_ID}"
              touch "/tmp/bigo-results/${HOST_ID}.failed"
            fi
          }
          ACTIVE=0
          while IFS='|' read -r HOST_ID SOURCE_URL SOURCE_KIND; do
            [ -z "${HOST_ID}" ] && continue
            run_capture "${HOST_ID}" "${SOURCE_URL}" "${SOURCE_KIND}" &
            ACTIVE=$((ACTIVE + 1))
            if [ "${ACTIVE}" -ge 8 ]; then
              wait -n || true
              ACTIVE=$((ACTIVE - 1))
            fi
          done < /tmp/bigo-hosts.txt
          wait
          python3 - <<'PY'
          import json,glob
          out={"highlights":[],"limit":10}
          for p in glob.glob("/tmp/bigo-results/*.json"):
              try:
                  d=json.load(open(p))
                  if d.get("highlight"):
                      out["highlights"].append(d["highlight"])
              except Exception as e:
                  print(f"::warning::bad result {p}: {e}")
          json.dump(out,open("/tmp/bigo-batch.json","w"))
          print(f"Verified BIGO batch: {len(out['highlights'])} highlight(s)")
          PY
          if compgen -G "/tmp/bigo-results/*.failed" > /dev/null; then
            echo "::error::One or more host capture attempts failed; empty batch is not a successful capture cycle."
            if [ "$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')" -lt 1 ]; then
              exit 1
            fi
          fi
          if [ "$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')" -lt 1 ]; then
            echo "::notice::No live hosts captured this cycle; no capture errors recorded."
            exit 0
          fi

      - name: Preserve BIGO registry candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigo-registry-capture-candidates-${{ github.run_id }}
          path: |
            /tmp/bigo-firecrawl-live-report.json
            /tmp/bigo-firecrawl-hls-report.json
          if-no-files-found: warn

      - name: Ingest, enrich and auto-post BIGO batch
        run: |
          set -euo pipefail
          COUNT="$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')"
          if [ "$COUNT" -lt 1 ]; then exit 0; fi
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          VERIFIED_HOST_IDS="${BIGO_VERIFIED_HOST_IDS:-}"
          VERIFIED_PATTERN="$(printf "%s" "${VERIFIED_HOST_IDS}" | tr ", " "\n" | sed "/^$/d" | jq -R -s 'split("\n") | map(select(length>0))')"
          jq --argjson verified "$VERIFIED_PATTERN" '{highlights: [.highlights[] | select(((.host_id // .source_asset_id // "") | tostring) as $host | any($verified[]; . as $id | $host == $id or ($host | startswith($id))))], limit: .limit} + {storage_only:false}' /tmp/bigo-batch.json > /tmp/bigo-verified-publish-batch.json
          VERIFIED_COUNT="$(jq ".highlights | length" /tmp/bigo-verified-publish-batch.json)"
          if [ "$VERIFIED_COUNT" -gt 0 ]; then
            curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-verified-publish-batch.json
          fi
          jq --argjson verified "$VERIFIED_PATTERN" '{highlights: [.highlights[] | select(((.host_id // .source_asset_id // "") | tostring) as $host | (any($verified[]; . as $id | $host == $id or ($host | startswith($id))) | not))], limit: .limit} + {storage_only:true}' /tmp/bigo-batch.json > /tmp/bigo-storage-batch.json
          STORAGE_COUNT="$(jq ".highlights | length" /tmp/bigo-storage-batch.json)"
          if [ "$STORAGE_COUNT" -gt 0 ]; then
            curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-storage-batch.json
          fi
