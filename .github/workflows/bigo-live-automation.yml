
name: BIGO Live -> R2 primary -> ChatB2K -> Buffer/Dropbox/Drive
run-name: BIGO capture/archive verification — ${{ github.event_name }} — run ${{ github.run_number }}
# Production capture workflow — R2 is primary verified media delivery; Dropbox remains fallback/archive and Drive remains optional.

on:
  # Code-change verification runs capture/archive only; scheduled runs retain the normal pipeline.
  push:
    branches: [main]
    paths:
      - '.github/workflows/bigo-live-automation.yml'
      - 'scripts/bigo-capture-host.sh'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# A single capture cycle at a time prevents five-minute schedules from stacking.
concurrency:
  group: bigo-live-capture
  cancel-in-progress: false

env:
  BIGO_HOST_IDS: ${{ secrets.BIGO_HOST_IDS }}
  BIGO_VERIFIED_HOST_IDS: ${{ secrets.BIGO_VERIFIED_HOST_IDS }}
  BIGO_SESSION_COOKIE: ${{ secrets.BIGO_SESSION_COOKIE }}
  CHATB2K_LIVE_INGEST_KEY: ${{ secrets.CHATB2K_LIVE_INGEST_KEY }}
  R2_WRITE_TOKEN: ${{ secrets.R2_WRITE_TOKEN }}
  R2_MEDIA_BASE: ${{ secrets.PRODUCTION_MEDIA_URL }}
  DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
  DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
  DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
  DRIVE_UPLOAD_URL: https://chatb2k.resofit.fit/api/google/drive-mcp/bigo-upload-session
  PIPELINE_URL: https://vbqjvmnhdtdhmeeudqnn.supabase.co/functions/v1/bigo-live-pipeline
  CAPTURE_STORAGE_ONLY: ${{ github.event_name == 'push' }}

jobs:
  capture-transform-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install capture tools
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python3 -m pip install --disable-pip-version-check -q 'streamlink>=8.6.1,<9' requests
          ffmpeg -version | head -n 1
          streamlink --version

      - name: Capture, normalize and prepare ChatB2K batch
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BIGO_SESSION_COOKIE:-}" ]; then
            echo "::warning::BIGO_SESSION_COOKIE is not configured; BIGO rooms requiring login may fail capture."
          else
            echo "::notice::BIGO authenticated-session secret is present; value is not logged."
          fi
          if [ -z "${R2_WRITE_TOKEN:-}" ]; then
            echo "::notice::R2 writer secret is absent; capture and verified archive will continue using available providers."
          else
            echo "::notice::R2 writer secret is present; value is not logged."
          fi
          mkdir -p /tmp/bigo-results
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if curl -fsS -H "Authorization: Bearer ${OIDC_TOKEN}" "${PIPELINE_URL}" > /tmp/bigo-sources.json; then
            REGISTRY_HOSTS="$(jq -r '.hosts[] | [.bigo_id, .source_url] | join("|")' /tmp/bigo-sources.json)"
          elif [ -n "${CHATB2K_LIVE_INGEST_KEY:-}" ] && curl -fsS -H "x-chatb2k-live-key: ${CHATB2K_LIVE_INGEST_KEY}" "${PIPELINE_URL}" > /tmp/bigo-sources.json; then
            # The Edge Function explicitly permits this legacy key for source-registry GETs.
            # Keep the key out of logs and never use it for publishing ingestion.
            REGISTRY_HOSTS="$(jq -r '.hosts[] | [.bigo_id, .source_url] | join("|")' /tmp/bigo-sources.json)"
            echo "::notice::Supabase BIGO source registry read succeeded via configured legacy read credential."
          else
            REGISTRY_HOSTS=""
            printf '{"provenance_policy_version":0,"hosts":[]}' > /tmp/bigo-sources.json
            echo "::warning::Supabase BIGO source registry lookup failed; using BIGO_HOST_IDS fallback."
          fi
          HOSTS="$(python3 - "${BIGO_HOST_IDS:-}" "${BIGO_VERIFIED_HOST_IDS:-}" "${REGISTRY_HOSTS}" <<'PY'
          import sys
          allow=[]
          for raw in (sys.argv[1] + "\n" + sys.argv[2]).replace(",", "\n").splitlines():
              host=raw.strip()
              if host and host not in allow:
                  allow.append(host)
          registry={}
          for line in sys.argv[3].splitlines():
              parts=line.split("|",1)
              if parts and parts[0].strip():
                  registry[parts[0].strip()]=parts[1].strip() if len(parts)>1 else ""
          for host in list(registry):
              if host not in allow:
                  allow.append(host)
          for host in allow:
              print(host + "|" + (registry.get(host) or "https://www.bigo.tv/" + host))
          PY
          )"
          if [ -n "${BIGO_HOST_IDS:-}" ]; then
            echo "::notice::Explicit BIGO_HOST_IDS are included in the capture pool."
          fi
          if [ -z "${HOSTS}" ]; then
            echo "::error::No eligible BIGO hosts available from Supabase source registry or BIGO_HOST_IDS."
            exit 1
          fi
          printf '%s\n' "${HOSTS}" > /tmp/bigo-hosts-all.txt
          # Capture the full deduplicated eligible host inventory each cycle; do not silently skip hosts by rotating a fixed-size subset.
          python3 - <<'PY'
          import os, time
          all_hosts=[line.strip() for line in open("/tmp/bigo-hosts-all.txt") if line.strip()]
          # Keep kisexy in every scheduled capture cycle; retain rotation for the remaining pool.
          priority_ids=[x.strip() for x in os.getenv("BIGO_PRIORITY_HOST_IDS","kisexy").replace(",", "\n").splitlines() if x.strip()]
          for host_id in priority_ids:
              if not any(line.split("|",1)[0].strip()==host_id for line in all_hosts):
                  all_hosts.append(host_id+"|https://www.bigo.tv/"+host_id)
          priority=[line for host_id in priority_ids for line in all_hosts if line.split("|",1)[0].strip()==host_id]
          priority_ids_present={line.split("|",1)[0].strip() for line in priority}
          remaining=[line for line in all_hosts if line.split("|",1)[0].strip() not in priority_ids_present]
          limit=max(1,min(int(os.getenv("BIGO_HOSTS_PER_CYCLE",str(len(all_hosts)))),len(all_hosts)))
          if len(priority)>limit:
              priority=priority[:limit]
          slots=limit-len(priority)
          if len(remaining)>slots:
              start=((int(time.time())//300)*max(1,slots))%len(remaining)
              rotated=remaining+remaining
              selected=rotated[start:start+slots]
          else:
              selected=remaining
          hosts=priority+selected
          open("/tmp/bigo-hosts.txt","w").writelines(line+"\n" for line in hosts)
          print(f"Selected {len(hosts)} of {len(all_hosts)} host(s) for this cycle; priority hosts: {', '.join(priority_ids)}")
          PY
          cp scripts/bigo-capture-host.sh /tmp/bigo-capture-host.sh
          chmod +x /tmp/bigo-capture-host.sh
          run_capture() {
            local HOST_ID="$1"
            local SOURCE_URL="$2"
            local SAFE_HOST
            SAFE_HOST="$(printf '%s' "${HOST_ID}" | tr -c 'A-Za-z0-9._-' '_')"
            if ! bash /tmp/bigo-capture-host.sh "${HOST_ID}" "${SOURCE_URL}"; then
              python3 - "${SAFE_HOST}" <<'PYFAIL'
          import json,sys
          json.dump({"status":"capture_failed","reason":"capture script exited nonzero; inspect host logs"},open("/tmp/bigo-results/"+sys.argv[1]+".failure.json","w"))
          PYFAIL
              echo "::error::BIGO capture script exited nonzero for host ${SAFE_HOST}"
            fi
            return 0
          }
          ACTIVE=0
          while IFS='|' read -r HOST_ID SOURCE_URL; do
            [ -z "${HOST_ID}" ] && continue
            run_capture "${HOST_ID}" "${SOURCE_URL}" &
            ACTIVE=$((ACTIVE + 1))
            if [ "${ACTIVE}" -ge 8 ]; then
              wait -n || true
              ACTIVE=$((ACTIVE - 1))
            fi
          done < /tmp/bigo-hosts.txt
          wait
          python3 - <<'PY'
          import json,glob,os
          out={"highlights":[],"limit":10,"capture_failures":[],"offline_hosts":[]}
          for p in glob.glob("/tmp/bigo-results/*.json"):
              try:
                  d=json.load(open(p))
                  if d.get("highlight"):
                      out["highlights"].append(d["highlight"])
                  elif p.endswith(".failure.json"):
                      record={"file":os.path.basename(p),"detail":d.get("reason","capture failed")}
                      if d.get("status")=="offline":
                          out["offline_hosts"].append(record)
                      else:
                          out["capture_failures"].append(record)
              except Exception as e:
                  out["capture_failures"].append({"file":os.path.basename(p),"detail":str(e)})
          json.dump(out,open("/tmp/bigo-batch.json","w"))
          print(f"Capture summary: {len(out['highlights'])} highlight(s), {len(out['offline_hosts'])} offline host(s), {len(out['capture_failures'])} capture failure(s)")
          if out["capture_failures"]:
              print("::warning::One or more BIGO host capture attempts failed; inspect the host capture logs for details.")
          PY
          if [ "$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')" -lt 1 ]; then
            FAILURES="$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["capture_failures"]))')"
            OFFLINE="$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["offline_hosts"]))')"
            if [ "$FAILURES" -gt 0 ]; then
              echo "::error::No highlights captured; $FAILURES capture failure(s) and $OFFLINE offline host(s) were recorded."
              exit 1
            fi
            echo "::notice::No live hosts captured this cycle; $OFFLINE offline host(s), no capture errors."
            exit 0
          fi

      - name: Ingest, enrich and auto-post BIGO batch
        run: |
          set -euo pipefail
          COUNT="$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')"
          if [ "$COUNT" -lt 1 ]; then exit 0; fi
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          VERIFIED_PATTERN="$(printf "%s" "${BIGO_VERIFIED_HOST_IDS:-}" | tr ", " "\n" | sed "/^$/d" | jq -R -s 'split("\n") | map(select(length>0))')"
          jq --argjson verified "$VERIFIED_PATTERN" --arg storage_only "${CAPTURE_STORAGE_ONLY:-false}" '{highlights: .highlights, verified_host_ids:$verified, limit: .limit, storage_only: ($storage_only == "true")}' /tmp/bigo-batch.json > /tmp/bigo-pipeline-batch.json
          curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-pipeline-batch.json
