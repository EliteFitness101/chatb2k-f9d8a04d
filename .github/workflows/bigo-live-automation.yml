name: BIGO Live -> Dropbox -> ChatB2K -> Buffer/Drive
# Production capture workflow — Dropbox is canonical media storage; ChatB2K ingests verified Dropbox URLs for enrichment, Buffer, and Drive archive.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bigo-live-automation.yml'
      - 'scripts/bigo-capture-host.sh'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  BIGO_HOST_IDS: ${{ secrets.BIGO_HOST_IDS }}
  BIGO_VERIFIED_HOST_IDS: ${{ secrets.BIGO_VERIFIED_HOST_IDS }}
  BIGO_LIVE_PROBE_HOST_IDS: ${{ secrets.BIGO_LIVE_PROBE_HOST_IDS }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  CHATB2K_LIVE_INGEST_KEY: ${{ secrets.CHATB2K_LIVE_INGEST_KEY }}
  DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
  DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
  DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
  BIGO_COOKIE_HEADER: ${{ secrets.BIGO_COOKIE_HEADER }}
  PIPELINE_URL: https://vbqjvmnhdtdhmeeudqnn.supabase.co/functions/v1/bigo-live-pipeline

jobs:
  capture-transform-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install capture tools (Dropbox archive)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check -q 'streamlink>=8.6.1,<9' requests

      - name: Set up Chrome browser (no Snap dependency)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Capture, normalize and prepare ChatB2K batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bigo-results
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          : "${FIRECRAWL_API_KEY:?FIRECRAWL_API_KEY is required for live-host discovery}"
          : "${BIGO_VERIFIED_HOST_IDS:?BIGO_VERIFIED_HOST_IDS is required; refusing unverified capture}"
          curl -fsS -H "Authorization: Bearer ${OIDC_TOKEN}" "${PIPELINE_URL}" > /tmp/bigo-sources.json
          # Candidate universe = active Supabase source registry + configured Firecrawl discovery IDs.
          # Capture eligibility is the intersection with the independently maintained verified-host list.
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.request, urllib.error
          sources=json.load(open("/tmp/bigo-sources.json"))
          registry={}
          for item in sources.get("hosts",[]):
              host=str(item.get("bigo_id") or "").strip()
              if host and re.fullmatch(r"[A-Za-z0-9._-]+",host):
                  registry[host]=str(item.get("source_url") or "")
          def ids(value):
              return [x.strip() for x in value.replace(",","\n").splitlines() if x.strip()]
          verified=set(ids(os.environ.get("BIGO_VERIFIED_HOST_IDS","")))
          probe=ids(os.environ.get("BIGO_LIVE_PROBE_HOST_IDS",""))
          candidates=list(dict.fromkeys(list(registry)+probe))
          candidates=[h for h in candidates if h in verified]
          if not candidates:
              raise SystemExit("No host is both registered/discovered and independently verified; fail closed.")
          report={"candidate_count":len(candidates),"verified_count":len(verified),"profile_verified":[],"rejected":[]}
          def scrape(host):
              url="https://www.bigo.tv/user/"+host
              payload=json.dumps({"url":url,"formats":["html","markdown"],"onlyMainContent":False}).encode()
              req=urllib.request.Request("https://api.firecrawl.dev/v2/scrape",data=payload,
                  headers={"Authorization":"Bearer "+os.environ["FIRECRAWL_API_KEY"],"Content-Type":"application/json"},method="POST")
              last_error=None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req,timeout=35) as response:
                          data=json.load(response)
                      doc=data.get("data",data)
                      body=(doc.get("html") or "")+"\n"+(doc.get("markdown") or "")
                      identity=(re.search(r"BIGO\s*ID\s*[:：]\s*"+re.escape(host)+r"\b",body,re.I)
                                or re.search(r"/user/"+re.escape(host)+r"(?:[/?#\"'\s]|$)",body,re.I))
                      if not identity:
                          return False,"Firecrawl page did not confirm requested BIGO profile identity"
                      return True,None
                  except urllib.error.HTTPError as exc:
                      last_error="HTTPError: HTTP Error %s: %s" % (exc.code,exc.reason)
                      if exc.code != 429 or attempt == 3:
                          break
                      time.sleep((attempt+1)*8)
                  except Exception as exc:
                      last_error=type(exc).__name__+": "+str(exc)[:180]
                      break
              return False,last_error or "Firecrawl profile scrape failed"
          for host in candidates[:50]:
              ok,error=scrape(host)
              if ok:
                  report["profile_verified"].append({"host_id":host,"source_url":""})
              else:
                  report["rejected"].append({"host_id":host,"reason":error})
              time.sleep(2)
          json.dump(report,open("/tmp/bigo-firecrawl-live-report.json","w"))
          with open("/tmp/bigo-hosts.txt","w") as out:
              for item in report["profile_verified"]:
                  out.write(item["host_id"]+"|"+item["source_url"]+"\n")
          print("Firecrawl profile identities verified: %d/%d candidates; rejected: %d" %
                (len(report["profile_verified"]),len(candidates),len(report["rejected"])))
          if not report["profile_verified"]:
              raise SystemExit("No independently verified BIGO profile identity was confirmed; no capture attempted.")
          PY
          echo "Selected $(wc -l < /tmp/bigo-hosts.txt) Firecrawl-live, verified host(s) for capture"
          curl -fsSL https://raw.githubusercontent.com/EliteFitness101/chatb2k-f9d8a04d/${GITHUB_SHA}/scripts/bigo-capture-host.sh -o /tmp/bigo-capture-host.sh
          curl -fsSL https://raw.githubusercontent.com/EliteFitness101/chatb2k-f9d8a04d/${GITHUB_SHA}/scripts/bigo-streamlink-capture.py -o /tmp/bigo-streamlink-capture.py
          chmod +x /tmp/bigo-capture-host.sh /tmp/bigo-streamlink-capture.py
          export BIGO_STREAMLINK_WRAPPER=/tmp/bigo-streamlink-capture.py
          run_capture() {
            local HOST_ID="$1"
            local SOURCE_URL="$2"
            if ! bash /tmp/bigo-capture-host.sh "${HOST_ID}" "${SOURCE_URL}"; then
              echo "::error::Capture failed for host ${HOST_ID}"
              touch "/tmp/bigo-results/${HOST_ID}.failed"
            fi
          }
          ACTIVE=0
          while IFS='|' read -r HOST_ID SOURCE_URL; do
            [ -z "${HOST_ID}" ] && continue
            run_capture "${HOST_ID}" "${SOURCE_URL}" &
            ACTIVE=$((ACTIVE + 1))
            if [ "${ACTIVE}" -ge 8 ]; then
              wait -n || true
              ACTIVE=$((ACTIVE - 1))
            fi
          done < /tmp/bigo-hosts.txt
          wait
          python3 - <<'PY'
          import json,glob
          out={"highlights":[],"limit":10}
          for p in glob.glob("/tmp/bigo-results/*.json"):
              try:
                  d=json.load(open(p))
                  if d.get("highlight"):
                      out["highlights"].append(d["highlight"])
              except Exception as e:
                  print(f"::warning::bad result {p}: {e}")
          json.dump(out,open("/tmp/bigo-batch.json","w"))
          print(f"Verified BIGO batch: {len(out['highlights'])} highlight(s)")
          PY
          if compgen -G "/tmp/bigo-results/*.failed" > /dev/null; then
            echo "::error::One or more host capture attempts failed; empty batch is not a successful capture cycle."
            if [ "$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')" -lt 1 ]; then
              exit 1
            fi
          fi
          if [ "$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')" -lt 1 ]; then
            echo "::notice::No live hosts captured this cycle; no capture errors recorded."
            exit 0
          fi

      - name: Preserve Firecrawl live-host decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigo-firecrawl-live-gate-${{ github.run_id }}
          path: /tmp/bigo-firecrawl-live-report.json
          if-no-files-found: warn

      - name: Ingest, enrich and auto-post BIGO batch
        run: |
          set -euo pipefail
          COUNT="$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')"
          if [ "$COUNT" -lt 1 ]; then exit 0; fi
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          VERIFIED_HOST_IDS="${BIGO_VERIFIED_HOST_IDS:-}"
          VERIFIED_PATTERN="$(printf "%s" "${VERIFIED_HOST_IDS}" | tr ", " "\n" | sed "/^$/d" | jq -R -s 'split("\n") | map(select(length>0))')"
          jq --argjson verified "$VERIFIED_PATTERN" '{highlights: [.highlights[] | select(((.host_id // .source_asset_id // "") | tostring) as $host | any($verified[]; . as $id | $host == $id or ($host | startswith($id))))], limit: .limit} + {storage_only:false}' /tmp/bigo-batch.json > /tmp/bigo-verified-publish-batch.json
          VERIFIED_COUNT="$(jq ".highlights | length" /tmp/bigo-verified-publish-batch.json)"
          if [ "$VERIFIED_COUNT" -gt 0 ]; then
            curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-verified-publish-batch.json
          fi
          jq --argjson verified "$VERIFIED_PATTERN" '{highlights: [.highlights[] | select(((.host_id // .source_asset_id // "") | tostring) as $host | (any($verified[]; . as $id | $host == $id or ($host | startswith($id))) | not))], limit: .limit} + {storage_only:true}' /tmp/bigo-batch.json > /tmp/bigo-storage-batch.json
          STORAGE_COUNT="$(jq ".highlights | length" /tmp/bigo-storage-batch.json)"
          if [ "$STORAGE_COUNT" -gt 0 ]; then
            curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-storage-batch.json
          fi
