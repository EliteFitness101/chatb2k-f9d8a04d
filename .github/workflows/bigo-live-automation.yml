name: BIGO Live -> ChatB2K -> Buffer
# Production capture workflow — proven capture logic preserved; YAML syntax repaired.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bigo-live-automation.yml'
      - 'scripts/bigo-capture-host.sh'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  BIGO_HOST_IDS: ${{ secrets.BIGO_HOST_IDS }}
  BIGO_VERIFIED_HOST_IDS: ${{ secrets.BIGO_VERIFIED_HOST_IDS }}
  CHATB2K_LIVE_INGEST_KEY: ${{ secrets.CHATB2K_LIVE_INGEST_KEY }}
  BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
  PIPELINE_URL: https://vbqjvmnhdtdhmeeudqnn.supabase.co/functions/v1/bigo-live-pipeline
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

jobs:
  capture-transform-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install capture and Blob tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg chromium
          python3 -m pip install --disable-pip-version-check -q 'streamlink>=8.6.1,<9' requests
          npm install --no-save --no-package-lock @vercel/blob

      - name: Capture, normalize and prepare ChatB2K batch
        shell: bash
        run: |
          set -euo pipefail
          : "${BLOB_READ_WRITE_TOKEN:?BLOB_READ_WRITE_TOKEN is required}"
          mkdir -p /tmp/bigo-results
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          FIRECRAWL_HOSTS=""
          if [ -n "${FIRECRAWL_API_KEY:-}" ]; then
            SEARCH_JSON="$(curl -fsS --max-time 30 -X POST "https://api.firecrawl.dev/v2/search" \
              -H "Authorization: Bearer ${FIRECRAWL_API_KEY}" \
              -H "Content-Type: application/json" \
              --data '{"query":"site:bigo.tv live BIGO","limit":20,"sources":["web"],"includeDomains":["bigo.tv"],"safe":true,"timeout":20000}' || true)"
            FIRECRAWL_HOSTS="$(python3 - "${SEARCH_JSON}" <<'PY'
          import json,re,sys
          try:
              d=json.loads(sys.argv[1] or "{}")
          except Exception:
              d={}
          urls=[]
          for item in (d.get("data",{}).get("web",[]) or []):
              u=str(item.get("url") or item.get("metadata",{}).get("url") or "")
              urls.append(u)
          reserved={"sid","watch","live","home","index","search","download","app","about","privacy","terms"}
          hosts=[]
          for u in urls:
              for m in re.finditer(r"https?://(?:www\.)?bigo\.tv/([^/?#]+)|[?&]h=([A-Za-z0-9_.-]+)",u,re.I):
                  host=(m.group(1) or m.group(2) or "").strip()
                  if host and host.lower() not in reserved and 3 <= len(host) <= 40 and host not in hosts:
                      hosts.append(host)
          for host in hosts[:20]:
              print(host + "\thttps://www.bigo.tv/" + host)
          PY
            )"
            if [ -n "${FIRECRAWL_HOSTS}" ]; then
              echo "::notice::Firecrawl discovered $(printf '%s\n' "${FIRECRAWL_HOSTS}" | wc -l) BIGO candidate host(s)."
            else
              echo "::notice::Firecrawl returned no usable BIGO host candidates this cycle."
            fi
          else
            echo "::notice::FIRECRAWL_API_KEY unavailable; discovery stage skipped."
          fi
          if curl -fsS -H "Authorization: Bearer ${OIDC_TOKEN}" "${PIPELINE_URL}" > /tmp/bigo-sources.json; then
            REGISTRY_HOSTS="$(jq -r '.hosts[] | [.bigo_id, .source_url] | @tsv' /tmp/bigo-sources.json)"
          else
            REGISTRY_HOSTS=""
            echo "::warning::Supabase BIGO source registry lookup failed; using BIGO_HOST_IDS fallback."
          fi
          HOSTS="$(python3 - "${BIGO_HOST_IDS:-}" "${REGISTRY_HOSTS}" "${FIRECRAWL_HOSTS}" <<'PY'
          import sys
          allow=[]
          for raw in sys.argv[1].replace(",", "\n").splitlines():
              host=raw.strip()
              if host and host not in allow:
                  allow.append(host)
          registry={}
          for line in sys.argv[2].splitlines():
              parts=line.split("\t",1)
              if parts and parts[0].strip():
                  registry[parts[0].strip()]=parts[1].strip() if len(parts)>1 else ""
          discovered={}
          for line in sys.argv[3].splitlines():
              parts=line.split("\t",1)
              if parts and parts[0].strip():
                  discovered[parts[0].strip()]=parts[1].strip() if len(parts)>1 else ""
                  if parts[0].strip() not in allow:
                      allow.append(parts[0].strip())
          for host in list(registry):
              if host not in allow:
                  allow.append(host)
          for host in allow:
              print(host + "\t" + (registry.get(host) or discovered.get(host) or "https://www.bigo.tv/" + host))
          PY
          )"
          if [ -n "${BIGO_HOST_IDS:-}" ]; then
            echo "::notice::Explicit BIGO_HOST_IDS are included in the capture pool."
          fi
          if [ -z "${HOSTS}" ]; then
            echo "::error::No eligible BIGO hosts available from Supabase source registry or BIGO_HOST_IDS."
            exit 1
          fi
          printf '%s\n' "${HOSTS}" > /tmp/bigo-hosts.txt
          echo "Selected $(wc -l < /tmp/bigo-hosts.txt) host(s) for capture"
          export BLOB_READ_WRITE_TOKEN
          curl -fsSL https://raw.githubusercontent.com/EliteFitness101/chatb2k-f9d8a04d/main/scripts/bigo-capture-host.sh -o /tmp/bigo-capture-host.sh
          chmod +x /tmp/bigo-capture-host.sh
          run_capture() {
            local HOST_ID="$1"
            local SOURCE_URL="$2"
            bash /tmp/bigo-capture-host.sh "${HOST_ID}" "${SOURCE_URL}" || true
          }
          ACTIVE=0
          while IFS=
          python3 - <<'PY'
          import json,glob
          out={"highlights":[],"limit":10}
          for p in glob.glob("/tmp/bigo-results/*.json"):
              try:
                  d=json.load(open(p))
                  if d.get("highlight"):
                      out["highlights"].append(d["highlight"])
              except Exception as e:
                  print(f"::warning::bad result {p}: {e}")
          json.dump(out,open("/tmp/bigo-batch.json","w"))
          print(f"Verified BIGO batch: {len(out['highlights'])} highlight(s)")
          PY
          if [ "$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')" -lt 1 ]; then
            echo "::notice::No live hosts captured this cycle; continuing."
            exit 0
          fi

      - name: Ingest, enrich and auto-post BIGO batch
        run: |
          set -euo pipefail
          COUNT="$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')"
          if [ "$COUNT" -lt 1 ]; then exit 0; fi
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          VERIFIED_HOST_IDS="${BIGO_VERIFIED_HOST_IDS:-}"
          VERIFIED_PATTERN="$(printf "%s" "${VERIFIED_HOST_IDS}" | tr ", " "\n" | sed "/^$/d" | jq -R -s 'split("\n") | map(select(length>0))')"
          jq --argjson verified "$VERIFIED_PATTERN" '{highlights: [.highlights[] | select(((.host_id // .source_asset_id // "") | tostring) as $host | any($verified[]; . as $id | $host == $id or ($host | startswith($id))))], limit: .limit} + {storage_only:false}' /tmp/bigo-batch.json > /tmp/bigo-verified-publish-batch.json
          VERIFIED_COUNT="$(jq ".highlights | length" /tmp/bigo-verified-publish-batch.json)"
          if [ "$VERIFIED_COUNT" -gt 0 ]; then
            curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-verified-publish-batch.json
          fi
          jq --argjson verified "$VERIFIED_PATTERN" '{highlights: [.highlights[] | select(((.host_id // .source_asset_id // "") | tostring) as $host | (any($verified[]; . as $id | $host == $id or ($host | startswith($id))) | not))], limit: .limit} + {storage_only:true}' /tmp/bigo-batch.json > /tmp/bigo-storage-batch.json
          STORAGE_COUNT="$(jq ".highlights | length" /tmp/bigo-storage-batch.json)"
          if [ "$STORAGE_COUNT" -gt 0 ]; then
            curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-storage-batch.json
          fi
\t' read -r HOST_ID SOURCE_URL; do
            [ -z "${HOST_ID}" ] && continue
            run_capture "${HOST_ID}" "${SOURCE_URL}" &
            ACTIVE=$((ACTIVE + 1))
            if [ "${ACTIVE}" -ge 8 ]; then
              wait -n || true
              ACTIVE=$((ACTIVE - 1))
            fi
          done < /tmp/bigo-hosts.txt
          wait
          python3 - <<'PY'
          import json,glob
          out={"highlights":[],"limit":10}
          for p in glob.glob("/tmp/bigo-results/*.json"):
              try:
                  d=json.load(open(p))
                  if d.get("highlight"):
                      out["highlights"].append(d["highlight"])
              except Exception as e:
                  print(f"::warning::bad result {p}: {e}")
          json.dump(out,open("/tmp/bigo-batch.json","w"))
          print(f"Verified BIGO batch: {len(out['highlights'])} highlight(s)")
          PY
          if [ "$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')" -lt 1 ]; then
            echo "::notice::No live hosts captured this cycle; continuing."
            exit 0
          fi

      - name: Ingest, enrich and auto-post BIGO batch
        run: |
          set -euo pipefail
          COUNT="$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')"
          if [ "$COUNT" -lt 1 ]; then exit 0; fi
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          VERIFIED_HOST_IDS="${BIGO_VERIFIED_HOST_IDS:-}"
          VERIFIED_PATTERN="$(printf "%s" "${VERIFIED_HOST_IDS}" | tr ", " "\n" | sed "/^$/d" | jq -R -s 'split("\n") | map(select(length>0))')"
          jq --argjson verified "$VERIFIED_PATTERN" '{highlights: [.highlights[] | select(((.host_id // .source_asset_id // "") | tostring) as $host | any($verified[]; . as $id | $host == $id or ($host | startswith($id))))], limit: .limit} + {storage_only:false}' /tmp/bigo-batch.json > /tmp/bigo-verified-publish-batch.json
          VERIFIED_COUNT="$(jq ".highlights | length" /tmp/bigo-verified-publish-batch.json)"
          if [ "$VERIFIED_COUNT" -gt 0 ]; then
            curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-verified-publish-batch.json
          fi
          jq --argjson verified "$VERIFIED_PATTERN" '{highlights: [.highlights[] | select(((.host_id // .source_asset_id // "") | tostring) as $host | (any($verified[]; . as $id | $host == $id or ($host | startswith($id))) | not))], limit: .limit} + {storage_only:true}' /tmp/bigo-batch.json > /tmp/bigo-storage-batch.json
          STORAGE_COUNT="$(jq ".highlights | length" /tmp/bigo-storage-batch.json)"
          if [ "$STORAGE_COUNT" -gt 0 ]; then
            curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-storage-batch.json
          fi
