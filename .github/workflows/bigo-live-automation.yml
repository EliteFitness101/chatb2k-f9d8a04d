name: BIGO Live → ChatB2K → Buffer (Sharded Multi-Host)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bigo-live-automation.yml'
      - 'scripts/bigo-capture-host.sh'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  BIGO_HOST_IDS: ${{ secrets.BIGO_HOST_IDS }}
  CHATB2K_LIVE_INGEST_KEY: ${{ secrets.CHATB2K_LIVE_INGEST_KEY }}
  BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
  PIPELINE_URL: https://vbqjvmnhdtdhmeeudqnn.supabase.co/functions/v1/bigo-live-pipeline
  SHARDS: "8"
  HOSTS_PER_SHARD_PARALLEL: "8"

jobs:
  capture-transform-publish:
    name: "BIGO shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - name: Install capture and Blob tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check -q 'streamlink>=8.6.0,<9' requests
          npm install --no-save --no-package-lock @vercel/blob

      - name: Capture, normalize and prepare ChatB2K batch
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          : "${BLOB_READ_WRITE_TOKEN:?BLOB_READ_WRITE_TOKEN is required}"
          mkdir -p /tmp/bigo-results
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          python3 - "${PIPELINE_URL}" "${OIDC_TOKEN}" "${BIGO_HOST_IDS:-}" <<'PY' > /tmp/bigo-hosts.txt
import json,sys,urllib.request
url,token,fallback=sys.argv[1:]
req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}"})
try:
    with urllib.request.urlopen(req,timeout=20) as r:
        data=json.load(r)
    hosts=data.get("hosts") or []
    if not hosts: raise RuntimeError("Supabase source registry returned zero eligible hosts")
    seen=set()
    for h in hosts:
        host=str(h.get("bigo_id") or "").strip()
        source=str(h.get("source_url") or "").strip()
        if host and host not in seen:
            print(host+"\t"+source); seen.add(host)
    print(f"::notice::Supabase source registry selected {len(seen)} active capture-enabled host(s)",file=sys.stderr)
except Exception as e:
    fb=[x.strip() for x in fallback.replace(","," ").split() if x.strip()]
    if not fb: raise
    for host in dict.fromkeys(fb): print(host+"\t")
    print(f"::warning::Supabase source registry unavailable; using BIGO_HOST_IDS fallback ({len(fb)} host(s)): {e}",file=sys.stderr)
PY
          mapfile -t HOST_ARRAY < /tmp/bigo-hosts.txt
          SELECTED=()
          for i in "${!HOST_ARRAY[@]}"; do
            if (( i % ${SHARDS:-8} == SHARD )); then SELECTED+=( "${HOST_ARRAY[$i]}" ); fi
          done
          echo "Shard $SHARD selected ${#SELECTED[@]} host(s)"
          export BLOB_READ_WRITE_TOKEN
          curl -fsSL https://raw.githubusercontent.com/EliteFitness101/chatb2k-f9d8a04d/main/scripts/bigo-capture-host.sh -o /tmp/bigo-capture-host.sh
          chmod +x /tmp/bigo-capture-host.sh
          printf '%s\n' "${SELECTED[@]}" | awk -F '\t' 'NF>=1 {print $1 "\t" $2}' | xargs -r -P "${HOSTS_PER_SHARD_PARALLEL:-8}" -n2 bash -c 'bash /tmp/bigo-capture-host.sh "$1" "$2"' _ || true
          python3 - <<'PY'
          import json,glob
          out={"highlights":[]}
          for p in glob.glob("/tmp/bigo-results/*.json"):
              try:
                  d=json.load(open(p))
                  if d.get("highlight"): out["highlights"].append(d["highlight"])
              except Exception as e:
                  print(f"::warning::bad result {p}: {e}")
          json.dump(out,open("/tmp/bigo-batch.json","w"))
          print(f"Verified BIGO shard batch: {len(out['highlights'])} highlight(s)")
          PY
          if [ "$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')" -lt 1 ]; then
            echo "::notice::Shard $SHARD captured no live hosts this cycle; continuing."
            exit 0
          fi

      - name: Ingest, enrich and auto-post BIGO batch
        run: |
          set -euo pipefail
          COUNT="$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')"
          if [ "$COUNT" -lt 1 ]; then exit 0; fi
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-batch.json
