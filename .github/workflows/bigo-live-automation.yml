name: BIGO Live → ChatB2K → Buffer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bigo-live-automation.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bigo-live-automation
  cancel-in-progress: false

env:
  BIGO_HOST_IDS: ${{ secrets.BIGO_HOST_IDS }}
  CHATB2K_LIVE_INGEST_KEY: ${{ secrets.CHATB2K_LIVE_INGEST_KEY }}
  BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
  PIPELINE_URL: https://vbqjvmnhdtdhmeeudqnn.supabase.co/functions/v1/bigo-live-pipeline

jobs:
  capture-transform-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install capture and Blob tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check -q 'streamlink>=8.6.0,<9' requests
          npm install --no-save --no-package-lock @vercel/blob

      - name: Capture, normalize and prepare ChatB2K batch
        shell: bash
        run: |
          set -euo pipefail
          : "${BLOB_READ_WRITE_TOKEN:?BLOB_READ_WRITE_TOKEN is required}"
          : "${BIGO_HOST_IDS:?BIGO_HOST_IDS must contain the configured BIGO host IDs}"
          HOSTS="${BIGO_HOST_IDS}"
          echo '{"highlights":[],"limit":10}' > /tmp/bigo-batch.json
          IFS=', ' read -r -a HOST_ARRAY <<< "$HOSTS"
          CAPTURED_COUNT=0
          for HOST in "${HOST_ARRAY[@]}"; do
            [ -z "$HOST" ] && continue
            TS="$(date -u +%Y%m%dT%H%M%SZ)"
            RAW="bigo-${HOST}-${TS}-raw.mp4"
            FILE="bigo-${HOST}-${TS}.mp4"
            COVER="bigo-${HOST}-${TS}.jpg"
            STREAMLINK_LOG="/tmp/streamlink-${HOST}.log"
            INFO='{"alive":false,"name":"BIGO Host","title":"BIGO Live Highlight","room_id":"'${HOST}'","hls_src":""}'

            set +e
            timeout 55s streamlink --stdout "https://www.bigo.tv/${HOST}" best 2>"$STREAMLINK_LOG" | ffmpeg -hide_banner -loglevel error -i pipe:0 -t 25 -c:v libx264 -preset veryfast -crf 23 -r 30 -fps_mode cfr -pix_fmt yuv420p -c:a aac -ar 48000 -movflags +faststart "$RAW"
            PIPE_RC=( "${PIPESTATUS[@]}" )
            CAPTURE_RC="${PIPE_RC[0]:-1}"
            FFMPEG_RC="${PIPE_RC[1]:-1}"
            set -e

            if [ "$CAPTURE_RC" -ne 0 ] || [ "$FFMPEG_RC" -ne 0 ] || [ ! -s "$RAW" ]; then
              echo "Streamlink capture failed for ${HOST}; using token-aware BIGO HLS discovery fallback"
              INFO="$(python3 - "$HOST" <<'PY'
          import base64,json,sys,time,secrets,re,requests
          from streamlink.utils.crypto import encrypt_openssl
          host=sys.argv[1]
          s=requests.Session()
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          h={'Accept':'application/json,text/javascript,*/*;q=0.01','User-Agent':ua,'Referer':f'https://www.bigo.tv/{host}'}
          def cb(): return f"jsonpcallback_{int(time.time()*1000)}_{secrets.randbelow(1000001)}"
          t=s.get('https://sec.bigo.sg/v1/webjs/t',params={'callback':cb()},headers=h,timeout=15)
          t.raise_for_status()
          m=re.search(r'jsonp\\w+\\((.+?)\\);?
            NAME="$(python3 -c 'import json,os; print(json.loads(os.environ["INFO"]).get("name", "BIGO Host"))')"
            TITLE="$(python3 -c 'import json,os; print(json.loads(os.environ["INFO"]).get("title", "BIGO Live Highlight"))')"
            ffmpeg -hide_banner -loglevel error -i "$RAW" -map 0:v:0 -frames:v 1 -q:v 3 "$COVER"
            ffmpeg -hide_banner -loglevel error -i "$RAW" -c copy -movflags +faststart "$FILE"
            META="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,avg_frame_rate,pix_fmt -show_entries format=duration -of json "$FILE")"
            export META
            read -r WIDTH HEIGHT FPS AVG_FPS DURATION PIX_FMT <<< "$(python3 - <<'PY'
          import json,os,fractions
          d=json.loads(os.environ['META']); s=(d.get('streams') or [{}])[0]
          def rate(x):
              try:return float(fractions.Fraction(x))
              except:return 0.0
          print(s.get('width',0),s.get('height',0),rate(s.get('r_frame_rate','0/1')),rate(s.get('avg_frame_rate','0/1')),float((d.get('format') or {}).get('duration') or 0),s.get('pix_fmt',''))
          PY
            )"
            python3 - "$FPS" "$AVG_FPS" "$WIDTH" "$HEIGHT" "$DURATION" "$PIX_FMT" <<'PY'
          import sys
          fps,avg,w,h,d,p=sys.argv[1:]
          fps=float(fps); avg=float(avg); w=int(w); h=int(h); d=float(d)
          if not (23 <= fps <= 60 and 23 <= avg <= 60): raise SystemExit('FAIL: FPS outside TikTok 23-60 requirement')
          if abs(fps-avg) > 0.5: raise SystemExit('FAIL: variable/inconsistent frame rate')
          if w < 720 or h < 1280 or not (0.55 <= w/h <= 0.75): raise SystemExit('FAIL: unsupported vertical dimensions/aspect')
          if not (1 <= d <= 180): raise SystemExit('FAIL: duration outside production short-form range')
          if p != 'yuv420p': raise SystemExit('FAIL: unsupported pixel format')
          PY
            export FILE COVER WIDTH HEIGHT DURATION FPS AVG_FPS PIX_FMT HOST NAME TITLE TS
            BLOB_URL="$(node --input-type=module -e 'import fs from "node:fs"; import { put } from "@vercel/blob"; const file=process.env.FILE; const body=fs.readFileSync(file); const r=await put(`bigo_highlights/${file}`,body,{access:"public",addRandomSuffix:false,contentType:"video/mp4"}); console.log(r.url);')"
            COVER_URL="$(node --input-type=module -e 'import fs from "node:fs"; import { put } from "@vercel/blob"; const file=process.env.COVER; const body=fs.readFileSync(file); const r=await put(`bigo_highlights/covers/${file}`,body,{access:"public",addRandomSuffix:false,contentType:"image/jpeg"}); console.log(r.url);')"
            export BLOB_URL COVER_URL
            FP="${HOST}:${TS}:${BLOB_URL}"
            export FP
            python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/bigo-batch.json'))
          info=json.loads(os.environ['INFO'])
          d['highlights'].append({'host_id':os.environ['HOST'],'host_name':os.environ['NAME'],'original_url':f'https://www.bigo.tv/{os.environ["HOST"]}','blob_url':os.environ['BLOB_URL'],'title':os.environ['TITLE'],'caption':f'{os.environ["TITLE"]} — live highlight from {os.environ["NAME"]}.','target_channels':['tiktok','youtube','google_business'],'fingerprint':os.environ['FP'],'source_asset_id':os.environ['FP'],'metadata':{'source':'bigo_live_auto_capture','room_id':info.get('room_id'),'width':int(os.environ['WIDTH']),'height':int(os.environ['HEIGHT']),'duration_seconds':float(os.environ['DURATION']),'aspect_ratio':float(os.environ['WIDTH'])/float(os.environ['HEIGHT']),'audio_present':True,'fps':float(os.environ['FPS']),'avg_fps':float(os.environ['AVG_FPS']),'frame_rate_verified':True,'codec':'h264','pixel_format':os.environ['PIX_FMT'],'cfr':True,'captured_at':os.environ['TS'],'blob_url':os.environ['BLOB_URL'],'cover_url':os.environ['COVER_URL']}})
          json.dump(d,open('/tmp/bigo-batch.json','w'))
          PY
            rm -f "$RAW" "$FILE" "$COVER"
            CAPTURED_COUNT=$((CAPTURED_COUNT + 1))
            echo "Captured ${HOST}; total captured this run: ${CAPTURED_COUNT}"
          done
          if [ "$CAPTURED_COUNT" -lt 1 ]; then
            echo "::error::No BIGO media was captured; refusing to send an empty batch to ChatB2K."
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/bigo-batch.json'))
          if not d.get('highlights'):
              raise SystemExit('FAIL: empty BIGO batch')
          print(f"Verified non-empty BIGO batch: {len(d['highlights'])} highlight(s)")
          PY

      - name: Ingest, enrich and auto-post BIGO batch
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-batch.json
,t.text)
          if not m: raise RuntimeError(f'timestamp endpoint returned unexpected payload: {t.text[:200]}')
          ts=json.loads(m.group(1))['time']
          payload={'dr':secrets.token_hex(16),'business':'bigolive-video','scene':'','at_time':ts,'ver':'2.0'}
          enc=encrypt_openssl(json.dumps(payload,separators=(',',':')).encode(),b'undefinedval0x01')
          tok=s.get('https://sec.bigo.sg/v1/webjs/status',params={'callback':cb(),'data':base64.b64encode(enc).decode()},headers=h,timeout=15)
          tok.raise_for_status()
          m=re.search(r'jsonp\\w+\\((.+?)\\);?
            NAME="$(python3 -c 'import json,os; print(json.loads(os.environ["INFO"]).get("name", "BIGO Host"))')"
            TITLE="$(python3 -c 'import json,os; print(json.loads(os.environ["INFO"]).get("title", "BIGO Live Highlight"))')"
            ffmpeg -hide_banner -loglevel error -i "$RAW" -map 0:v:0 -frames:v 1 -q:v 3 "$COVER"
