          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-batch.json
,tok.text)
          if not m: raise RuntimeError(f'token endpoint returned unexpected payload: {tok.text[:200]}')
          token=json.loads(m.group(1))['token']
          r=s.post('https://ta.bigo.tv/official_website/studio/getInternalStudioInfo',params={'siteId':host,'verify':'','token':token},headers=h,timeout=15)
          r.raise_for_status(); d=r.json().get('data') or {}
          print(json.dumps({'alive':bool(d.get('roomId')),'name':d.get('clientBigoId') or host,'title':d.get('roomTopic') or d.get('gameTitle') or 'BIGO Live Highlight','room_id':d.get('roomId') or host,'hls_src':d.get('hls_src') or ''}))
          PY
              )"
              export INFO
              STREAM_URL="$(python3 -c 'import json,os; print(json.loads(os.environ["INFO"]).get("hls_src", ""))')"
              if [ -n "$STREAM_URL" ]; then
                timeout 45s curl -L --fail --silent --show-error --retry 2 --retry-delay 1 -A 'Mozilla/5.0' -e "https://www.bigo.tv/${HOST}" "$STREAM_URL" | ffmpeg -hide_banner -loglevel error -i pipe:0 -t 25 -c:v libx264 -preset veryfast -crf 23 -r 30 -fps_mode cfr -pix_fmt yuv420p -c:a aac -ar 48000 -movflags +faststart "$RAW" || true
              fi
            fi

            if [ ! -s "$RAW" ]; then
              echo "::error::BIGO host ${HOST} produced no capture. Streamlink/fallback both failed."
              cat "$STREAMLINK_LOG" 2>/dev/null || true
              exit 1
            fi
            export INFO
            NAME="$(python3 -c 'import json,os; print(json.loads(os.environ["INFO"]).get("name", "BIGO Host"))')"
            TITLE="$(python3 -c 'import json,os; print(json.loads(os.environ["INFO"]).get("title", "BIGO Live Highlight"))')"
