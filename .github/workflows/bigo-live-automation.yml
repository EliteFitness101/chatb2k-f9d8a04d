
name: BIGO Live -> Dropbox -> ChatB2K -> Buffer/Drive
run-name: BIGO capture/archive verification — ${{ github.event_name }} — run ${{ github.run_number }}
# Production capture workflow — October-verified Dropbox-primary media archive; Google Drive secondary.
# 2026-11-23: operationally revalidated via source-registry-triggered recovery run; no secrets or host allowlists changed.

on:
  # Code-change verification runs capture/archive only; scheduled runs retain the normal pipeline.
  push:
    branches: [main]
    paths:
      - '.github/workflows/bigo-live-automation.yml'
      - 'scripts/bigo-capture-host.sh'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# A single capture cycle at a time prevents five-minute schedules from stacking.
concurrency:
  group: bigo-live-capture
  cancel-in-progress: false

env:
  BIGO_HOST_IDS: ${{ secrets.BIGO_HOST_IDS }}
  BIGO_VERIFIED_HOST_IDS: ${{ secrets.BIGO_VERIFIED_HOST_IDS }}
  BIGO_COOKIE_HEADER: ${{ secrets.BIGO_COOKIE_HEADER || vars.BIGO_COOKIE_HEADER }}
  CHATB2K_LIVE_INGEST_KEY: ${{ secrets.CHATB2K_LIVE_INGEST_KEY }}
  DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
  DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
  DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
  DRIVE_UPLOAD_URL: https://chatb2k.resofit.fit/api/google/drive-mcp/bigo-upload-session
  PIPELINE_URL: https://vbqjvmnhdtdhmeeudqnn.supabase.co/functions/v1/bigo-live-pipeline
  CAPTURE_STORAGE_ONLY: ${{ github.event_name == 'push' }}
  BIGO_CAPTURE_PARALLELISM: ${{ vars.BIGO_CAPTURE_PARALLELISM }}

jobs:
  regional-token-preflight:
    name: Verify BIGO token from Mumbai Edge region
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Supabase regional routing and BIGO token issuance
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BIGO_COOKIE_HEADER:-}" ]; then
            echo "::warning::BIGO session cookie is not configured; skipping authenticated token preflight. Scheduled capture will use the canonical public-room HLS fallback."
            exit 0
          fi
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "x-region: ap-south-1" \
            "${PIPELINE_URL}" \
            -o /tmp/bigo-sources.json
          HOST_ID="$(jq -r '.hosts[0].bigo_id // empty' /tmp/bigo-sources.json)"
          if [ -z "${HOST_ID}" ]; then
            echo "::error::The authoritative BIGO source registry has no active capture-enabled hosts."
            exit 1
          fi
          BODY="$(python3 - "${HOST_ID}" "${BIGO_COOKIE_HEADER:-}" <<'PYBODY'
          import json,sys
          print(json.dumps({"action":"resolve_bigo_room","host_id":sys.argv[1],"cookie_header":sys.argv[2]}))
          PYBODY
          )"
          STATUS="$(curl --silent --show-error -w '%{http_code}' -D /tmp/bigo-preflight.headers \
            -X POST "${PIPELINE_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "x-region: ap-south-1" \
            --data-binary "${BODY}" \
            -o /tmp/bigo-preflight.json)"
          if [ "${STATUS}" != "200" ]; then
            jq -c '{ok,error,detail,upstream_code,upstream_info,region}' /tmp/bigo-preflight.json 2>/dev/null || true
            echo "::error::BIGO token resolver returned HTTP ${STATUS}."
            exit 1
          fi
          jq -e '.ok == true and .token_issued == true and .room_info_ok == true and .region == "ap-south-1"' /tmp/bigo-preflight.json >/dev/null
          EDGE_REGION="$(grep -i '^x-sb-edge-region:' /tmp/bigo-preflight.headers | tail -n1 | cut -d: -f2- | tr -d '\r' | xargs)"
          if [ "${EDGE_REGION}" != "ap-south-1" ]; then
            echo "::error::Supabase did not honor Mumbai region (reported: ${EDGE_REGION:-missing})."
            exit 1
          fi
          jq -c '{ok,token_issued,room_info_ok,alive,region}' /tmp/bigo-preflight.json

  capture-transform-publish:
    # Workflow-file/code pushes must not trigger another full-inventory production capture.
    # Scheduled production cycles and explicitly dispatched tests remain enabled.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate established BIGO session configuration
        shell: bash
        run: |
          if [ -z "${BIGO_COOKIE_HEADER:-}" ]; then
            echo "::warning::BIGO_COOKIE_HEADER is empty; attempting public-room discovery without a session cookie. Private rooms may remain unavailable."
          fi

      - name: Install capture tools
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python3 -m pip install --disable-pip-version-check -q 'streamlink>=8.6.1,<9' requests
          ffmpeg -version | head -n 1
          streamlink --version

      - name: Capture, normalize and prepare ChatB2K batch
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          for name in DROPBOX_APP_KEY DROPBOX_APP_SECRET DROPBOX_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required October Dropbox primary-store credential $name is missing."
              exit 1
            fi
          done
          echo "::notice::Dropbox primary-store credentials are present; values are not logged."
          mkdir -p /tmp/bigo-results
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          export OIDC_TOKEN
          if curl -fsS -H "Authorization: Bearer ${OIDC_TOKEN}" "${PIPELINE_URL}" > /tmp/bigo-sources.json; then
            REGISTRY_HOSTS="$(jq -r '.hosts[] | [.bigo_id, .source_url] | join("|")' /tmp/bigo-sources.json)"
            echo "::notice::Supabase BIGO source-of-truth registry loaded."
          elif [ -n "${CHATB2K_LIVE_INGEST_KEY:-}" ] && curl -fsS -H "x-chatb2k-live-key: ${CHATB2K_LIVE_INGEST_KEY}" "${PIPELINE_URL}" > /tmp/bigo-sources.json; then
            REGISTRY_HOSTS="$(jq -r '.hosts[] | [.bigo_id, .source_url] | join("|")' /tmp/bigo-sources.json)"
            echo "::notice::Supabase BIGO source registry loaded using the configured read credential."
          else
            echo "::error::Supabase BIGO source-of-truth registry is unavailable; refusing to run from a stale host snapshot."
            exit 1
          fi
          HOSTS="$(python3 - "${BIGO_HOST_IDS:-}" "${BIGO_VERIFIED_HOST_IDS:-}" "${REGISTRY_HOSTS}" <<'PY'
          import sys
          registry={}
          for line in sys.argv[3].splitlines():
              parts=line.split("|",1)
              host=parts[0].strip() if parts else ""
              if host:
                  registry[host]=parts[1].strip() if len(parts)>1 else ""
          # Source registry is authoritative; environment/Actions-secret IDs are additive.
          for raw in (sys.argv[1] + "\n" + sys.argv[2]).replace(",", "\n").splitlines():
              host=raw.strip()
              if host and host not in registry:
                  registry[host]=""
          for host, source in registry.items():
              print(host + "|" + (source or "https://www.bigo.tv/" + host))
          PY
          )"
          if [ -z "${HOSTS}" ]; then
            echo "::error::No BIGO hosts are configured in the source registry or additive environment inputs."
            exit 1
          fi
          printf '%s\n' "${HOSTS}" > /tmp/bigo-hosts-all.txt
          cp /tmp/bigo-hosts-all.txt /tmp/bigo-hosts.txt
          HOST_COUNT="$(wc -l < /tmp/bigo-hosts.txt | tr -d ' ')"
          echo "::notice::Processing the complete dynamic source-of-truth inventory: ${HOST_COUNT} host(s), with no fixed cohort size or rotation cap."
          cp scripts/bigo-capture-host.sh /tmp/bigo-capture-host.sh
          chmod +x /tmp/bigo-capture-host.sh
          run_capture() {
            local HOST_ID="$1"
            local SOURCE_URL="$2"
            local SAFE_HOST
            SAFE_HOST="$(printf '%s' "${HOST_ID}" | tr -c 'A-Za-z0-9._-' '_')"
            if ! bash /tmp/bigo-capture-host.sh "${HOST_ID}" "${SOURCE_URL}"; then
              python3 - "${SAFE_HOST}" <<'PYFAIL'
          import json,sys
          json.dump({"status":"capture_failed","reason":"capture script exited nonzero; inspect host logs"},open("/tmp/bigo-results/"+sys.argv[1]+".failure.json","w"))
          PYFAIL
              echo "::error::BIGO capture script exited nonzero for host ${SAFE_HOST}"
            fi
            return 0
          }
          ACTIVE=0
          PARALLELISM="${BIGO_CAPTURE_PARALLELISM:-8}"
          if ! [[ "${PARALLELISM}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::BIGO_CAPTURE_PARALLELISM must be a positive integer."
            exit 1
          fi
          while IFS='|' read -r HOST_ID SOURCE_URL; do
            [ -z "${HOST_ID}" ] && continue
            run_capture "${HOST_ID}" "${SOURCE_URL}" &
            ACTIVE=$((ACTIVE + 1))
            if [ "${ACTIVE}" -ge "${PARALLELISM}" ]; then
              wait -n || true
              ACTIVE=$((ACTIVE - 1))
            fi
          done < /tmp/bigo-hosts.txt
          wait
          python3 - <<'PY'
          import json,glob,os
          out={"highlights":[],"limit":10,"capture_failures":[],"offline_hosts":[]}
          for p in glob.glob("/tmp/bigo-results/*.json"):
              try:
                  d=json.load(open(p))
                  if d.get("highlight"):
                      out["highlights"].append(d["highlight"])
                  elif p.endswith(".failure.json"):
                      record={"file":os.path.basename(p),"detail":d.get("reason","capture failed")}
                      if d.get("status")=="offline":
                          out["offline_hosts"].append(record)
                      else:
                          out["capture_failures"].append(record)
              except Exception as e:
                  out["capture_failures"].append({"file":os.path.basename(p),"detail":str(e)})
          json.dump(out,open("/tmp/bigo-batch.json","w"))
          print(f"Capture summary: {len(out['highlights'])} highlight(s), {len(out['offline_hosts'])} offline host(s), {len(out['capture_failures'])} capture failure(s)")
          if out["capture_failures"]:
              print("::warning::One or more BIGO host capture attempts failed; inspect the host capture logs for details.")
          PY
          if [ "$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')" -lt 1 ]; then
            FAILURES="$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["capture_failures"]))')"
            OFFLINE="$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["offline_hosts"]))')"
            if [ "$FAILURES" -gt 0 ]; then
              echo "::error::No highlights captured; $FAILURES capture failure(s) and $OFFLINE offline host(s) were recorded."
              exit 1
            fi
            echo "::notice::No live hosts captured this cycle; $OFFLINE offline host(s), no capture errors."
            exit 0
          fi

      - name: Ingest, enrich and auto-post BIGO batch
        run: |
          set -euo pipefail
          COUNT="$(python3 -c 'import json; print(len(json.load(open("/tmp/bigo-batch.json"))["highlights"]))')"
          if [ "$COUNT" -lt 1 ]; then exit 0; fi
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          VERIFIED_PATTERN="$(printf "%s" "${BIGO_VERIFIED_HOST_IDS:-}" | tr ", " "\n" | sed "/^$/d" | jq -R -s 'split("\n") | map(select(length>0))')"
          jq --argjson verified "$VERIFIED_PATTERN" --arg storage_only "${CAPTURE_STORAGE_ONLY:-false}" '{highlights: .highlights, verified_host_ids:$verified, limit: .limit, storage_only: ($storage_only == "true")}' /tmp/bigo-batch.json > /tmp/bigo-pipeline-batch.json
          curl -fsS -X POST "${PIPELINE_URL}" -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/bigo-pipeline-batch.json
