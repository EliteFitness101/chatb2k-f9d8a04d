name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: bun install

      - name: Lint changed files
        shell: bash
        run: |
          FILES="$(git diff --name-only HEAD^1 HEAD | grep -E '\\.(ts|tsx|js|jsx)$' || true)"
          if [ -n "$FILES" ]; then
            bunx eslint $FILES
          else
            echo "No changed JavaScript/TypeScript files to lint."
          fi

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
