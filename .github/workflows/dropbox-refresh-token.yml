name: Obtain and Save Dropbox Refresh Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exchange Dropbox authorization code and save refresh token
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_AUTH_CODE: ${{ secrets.DROPBOX_AUTH_CODE }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install --quiet requests pynacl
          python <<'PY'
          import base64
          import os
          import sys
          import requests
          from nacl.public import PublicKey, SealedBox

          def fail(message):
              print(f"ERROR: {message}")
              sys.exit(1)

          app_key = os.environ.get("DROPBOX_APP_KEY", "")
          app_secret = os.environ.get("DROPBOX_APP_SECRET", "")
          auth_code = os.environ.get("DROPBOX_AUTH_CODE", "")
          gh_token = os.environ.get("GH_ADMIN_TOKEN", "")
          repo = os.environ["GITHUB_REPOSITORY"]

          if not all([app_key, app_secret, auth_code, gh_token]):
              fail("Missing required GitHub Actions secrets: DROPBOX_APP_KEY, DROPBOX_APP_SECRET, DROPBOX_AUTH_CODE, or GH_ADMIN_TOKEN.")

          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          response = requests.post(
              "https://api.dropboxapi.com/oauth2/token",
              auth=(app_key, app_secret),
              data={"code": auth_code, "grant_type": "authorization_code"},
              timeout=30,
          )
          if response.status_code != 200:
              fail(f"Dropbox token exchange failed (HTTP {response.status_code}); the code may be expired, already used, or paired with different app credentials.")

          refresh_token = response.json().get("refresh_token")
          if not refresh_token:
              fail("Dropbox returned no refresh token; confirm offline access was requested.")

          api = f"https://api.github.com/repos/{repo}/actions/secrets"
          response = requests.get(f"{api}/public-key", headers=headers, timeout=30)
          if response.status_code != 200:
              fail(f"Cannot retrieve GitHub Actions secret public key (HTTP {response.status_code}); check GH_ADMIN_TOKEN permissions.")

          public_key_data = response.json()
          encrypted_value = base64.b64encode(
              SealedBox(PublicKey(base64.b64decode(public_key_data["key"]))).encrypt(
                  refresh_token.encode()
              )
          ).decode()

          response = requests.put(
              f"{api}/DROPBOX_REFRESH_TOKEN",
              headers=headers,
              json={
                  "encrypted_value": encrypted_value,
                  "key_id": public_key_data["key_id"],
              },
              timeout=30,
          )
          if response.status_code not in (201, 204):
              fail(f"GitHub rejected the DROPBOX_REFRESH_TOKEN secret update (HTTP {response.status_code}); check repository Actions-secret write permissions.")

          # GitHub does not provide GET /actions/secrets/{secret_name}.
          # Verify by listing secret metadata only; never retrieve or print secret values.
          response = requests.get(api, headers=headers, params={"per_page": 100}, timeout=30)
          if response.status_code != 200:
              fail(f"Secret update was accepted, but listing secret metadata failed (HTTP {response.status_code}).")

          names = {item.get("name") for item in response.json().get("secrets", [])}
          if "DROPBOX_REFRESH_TOKEN" not in names:
              fail("GitHub accepted the update request, but DROPBOX_REFRESH_TOKEN was not present in the repository secret metadata.")

          print("SUCCESS: Dropbox refresh token exchanged; DROPBOX_REFRESH_TOKEN saved and confirmed by GitHub secret metadata. Token value was not displayed.")
          PY
