name: BIGO Config Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bigo-config-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  PROBE_SECRET: ${{ secrets.BIGO_HOST_IDS }}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Config probe
        run: |
          set -euo pipefail
          echo "config probe OK"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
