name: Gemini Drive Bridge Tests

on:
  pull_request:
    paths:
      - "integrations/gemini-drive-bridge/**"
      - ".github/workflows/gemini-drive-bridge-tests.yml"
  push:
    branches: [main]
    paths:
      - "integrations/gemini-drive-bridge/**"
      - ".github/workflows/gemini-drive-bridge-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/gemini-drive-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/gemini-drive-bridge/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_app.py
