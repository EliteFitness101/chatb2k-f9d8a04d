name: BIGO Noble_terra Proof

# Retry after signed /sid/ HLS discovery patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bigo-noble-proof.yml'

permissions:
  contents: read
  id-token: write

env:
  BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
  BIGO_NOBLE_TERRA_SOURCE_URL: ${{ secrets.BIGO_NOBLE_TERRA_SOURCE_URL }}
  PIPELINE_URL: https://vbqjvmnhdtdhmeeudqnn.supabase.co/functions/v1/bigo-live-pipeline

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production worker
        uses: actions/checkout@v4

      - name: Install capture and Blob tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check -q 'streamlink==8.6.1' requests
          rm -rf /tmp/bigo-blob-node
          mkdir -p /tmp/bigo-blob-node
          cd /tmp/bigo-blob-node
          npm init -y --silent
          npm install --no-package-lock --omit=dev @vercel/blob@2.6.1 --no-audit --no-fund
          cd -

      - name: Capture Noble_terra from signed source
        run: |
          set -euo pipefail
          : "${BLOB_READ_WRITE_TOKEN:?BLOB_READ_WRITE_TOKEN is required}"
          : "${BIGO_NOBLE_TERRA_SOURCE_URL:?BIGO_NOBLE_TERRA_SOURCE_URL is required}"
          mkdir -p /tmp/bigo-results
          export BLOB_READ_WRITE_TOKEN
          chmod +x ./scripts/bigo-capture-host.sh
          bash ./scripts/bigo-capture-host.sh "Noble_terra" "${BIGO_NOBLE_TERRA_SOURCE_URL}"
          test -s /tmp/bigo-results/Noble_terra.json
          jq . /tmp/bigo-results/Noble_terra.json

      - name: Ingest captured highlight into canonical pipeline
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chatb2k-live-pipeline" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          jq '{highlights: [.highlight], limit: 1} + {storage_only:true}' /tmp/bigo-results/Noble_terra.json > /tmp/noble-batch.json
          curl -fsS -X POST "${PIPELINE_URL}"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H 'Content-Type: application/json'             --data-binary @/tmp/noble-batch.json
