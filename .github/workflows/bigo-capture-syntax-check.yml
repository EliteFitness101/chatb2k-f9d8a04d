name: BIGO Capture Syntax Check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bigo-capture-host.sh'
      - 'scripts/bigo-streamlink-capture.py'
      - '.github/workflows/bigo-capture-syntax-check.yml'
  pull_request:
    paths:
      - 'scripts/bigo-capture-host.sh'
      - 'scripts/bigo-streamlink-capture.py'
      - '.github/workflows/bigo-capture-syntax-check.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n scripts/bigo-capture-host.sh
      - name: Validate BIGO Streamlink shim Python
        run: python3 -m py_compile scripts/bigo-streamlink-capture.py
      - name: Validate embedded BIGO regional request Python
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("scripts/bigo-capture-host.sh").read_text()
          marker = "<<'PYINFO'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\nPYINFO", start)
          compile(source[start:end], "bigo-regional-request", "exec")
          print("Embedded BIGO regional request syntax: OK")
          PY
