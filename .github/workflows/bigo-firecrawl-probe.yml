name: BIGO Firecrawl Discovery Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bigo-firecrawl-probe.yml'
      - 'scripts/bigo-firecrawl-runner.py'
  pull_request:
    paths:
      - '.github/workflows/bigo-firecrawl-probe.yml'
      - 'scripts/bigo-firecrawl-runner.py'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Firecrawl v2 operation'
        required: true
        default: 'scrape'
        type: choice
        options: [scrape, crawl, map, search, extract]
      host_id:
        description: 'Optional single BIGO host ID'
        required: false
        type: string
      url:
        description: 'Optional public HTTPS URL (overrides host ID)'
        required: false
        type: string
      query:
        description: 'Search query (used by the search operation)'
        required: false
        type: string
      max_pages:
        description: 'Maximum pages/links for crawl, map, or search'
        required: false
        default: '20'
        type: string
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Firecrawl runner syntax
        run: python3 -m py_compile scripts/bigo-firecrawl-runner.py

  discover:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      BIGO_LIVE_PROBE_HOST_IDS: ${{ secrets.BIGO_LIVE_PROBE_HOST_IDS }}
      BIGO_PROBE_TARGET_HOST_ID: ${{ inputs.host_id || '' }}
      FIRECRAWL_OPERATION: ${{ inputs.operation || 'scrape' }}
      FIRECRAWL_URL: ${{ inputs.url || '' }}
      FIRECRAWL_SEARCH_QUERY: ${{ inputs.query || '' }}
      FIRECRAWL_MAX_PAGES: ${{ inputs.max_pages || '20' }}
      FIRECRAWL_REPORT_PATH: /tmp/bigo-firecrawl-report.json
    steps:
      - uses: actions/checkout@v4
      - name: Run observation-only Firecrawl v2 operation
        run: python3 scripts/bigo-firecrawl-runner.py
      - name: Upload sanitized discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigo-firecrawl-discovery-${{ github.run_id }}
          path: /tmp/bigo-firecrawl-report.json
          if-no-files-found: warn
