name: BIGO ID batch proof (temporary)
on:
  push:
    paths:
      - ".github/workflows/bigo-id-batch-proof.yml"
jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BIGO_CAPTURE_DURATION_SECONDS: "15"
    steps:
      - uses: actions/checkout@v4
      - name: Install capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --break-system-packages --disable-pip-version-check -q "streamlink>=8.6.0,<9" requests
          npm install --no-save @vercel/blob
      - name: Capture supplied BIGO IDs
        run: |
          mkdir -p /tmp/bigo-results
          ids="748833040 1091768750 804247401 calderdeo 1102883606 950503985 snow254 pickyboo spicyslim Noble_terra 780924723 1083837818 880823151 963376817 1089203501 990938206 989484732"
          for id in $ids; do
            echo "::group::BIGO ID $id"
            bash scripts/bigo-capture-host.sh "$id" || true
            if [ -f "/tmp/bigo-results/$id.json" ]; then
              echo "RESULT $id: CAPTURED"
              cat "/tmp/bigo-results/$id.json"
            elif [ -f "/tmp/bigo-results/$id.failure.json" ]; then
              echo "RESULT $id: FAILED"
              cat "/tmp/bigo-results/$id.failure.json"
            else
              echo "RESULT $id: NO RESULT FILE"
            fi
            echo "::endgroup::"
          done
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigo-id-batch-proof-${{ github.run_id }}
          path: /tmp/bigo-results/
          if-no-files-found: warn
